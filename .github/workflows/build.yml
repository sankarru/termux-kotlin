name: Build Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 29
        run: sdkmanager "ndk;29.0.14206865"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > release.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}

      - name: Download bootstraps
        run: ./gradlew :app:downloadBootstraps --console=plain --no-daemon
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --console=plain --no-daemon -x lintVitalAnalyzeRelease
        env:
          TERMUX_RELEASE_STORE_FILE: release.jks
          TERMUX_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          TERMUX_RELEASE_KEY_ALIAS: release
          TERMUX_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          JAVA_HOME: ${{ env.JAVA_HOME }}
          JITPACK_NDK_VERSION: "29.0.14206865"

      - name: Verify APK
        run: |
          ls -lh app/build/outputs/apk/release/app-release.apk
          python3 -c "
          import zipfile
          z = zipfile.ZipFile('app/build/outputs/apk/release/app-release.apk')
          total = sum(i.file_size for i in z.infolist())
          print(f'APK: {total/1024/1024:.1f}MB, {len(z.namelist())} entries')
          print(f'Manifest: {any(\"AndroidManifest\" in n for n in z.namelist())}')
          print(f'resources.arsc: {any(\"resources.arsc\" in n for n in z.namelist())}')
          print(f'dex: {sum(1 for n in z.namelist() if n.endswith(\".dex\"))}')
          print(f'.so: {sum(1 for n in z.namelist() if n.endswith(\".so\"))}')
          z.close()
          "

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: termux-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
