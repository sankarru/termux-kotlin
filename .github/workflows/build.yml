name: Build Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 29
        run: sdkmanager "ndk;29.0.14206865"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download bootstraps
        run: ./gradlew :app:downloadBootstraps --console=plain --no-daemon

      - name: Install nforge logger
        run: |
          mkdir -p ~/.gradle/init.d
          curl -sL https://raw.githubusercontent.com/sankarru/termux-kotlin/main/.github/workflows/wire-aot.gradle -o ~/.gradle/init.d/wire-aot.gradle || \
          echo "Logger not in repo yet, creating inline"
          cat > ~/.gradle/init.d/wire-aot.gradle << 'GRADLEOF'
          import java.io.File
          def logDir = "/tmp/nforge-gradle-logs"
          new File(logDir).mkdirs()
          def taskLog = new FileWriter(new File(logDir, "tasks.log"))
          taskLog.write("=== nforge Gradle Logger ===\n")
          taskLog.write("time: ${new Date()}\n\n")
          gradle.projectsEvaluated { proj ->
              proj.rootProject.allprojects.each { project ->
                  project.tasks.configureEach { task ->
                      def cls = task.class.name
                      if (cls.contains("R8Task")) {
                          taskLog.write("=== [R8] ${task.name} (${task.path}) ===\n")
                          taskLog.write("  class: ${cls}\n")
                          task.inputs.files.each { f -> taskLog.write("  input: ${f.absolutePath}\n") }
                          try { taskLog.write("  outputDir: ${task.outputDirectory?.asFile?.get()?.absolutePath}\n") } catch (e) {}
                          try { taskLog.write("  mapping: ${task.outputMappingFile?.asFile?.get()?.absolutePath}\n") } catch (e) {}
                          taskLog.flush()
                      }
                      if (task.name.toLowerCase().contains("package") && task.name.toLowerCase().contains("release")) {
                          taskLog.write("=== [PACKAGE] ${task.name} (${task.path}) ===\n")
                          task.inputs.files.each { f -> taskLog.write("  input: ${f.absolutePath}\n") }
                          try { taskLog.write("  outputDir: ${task.outputDirectory?.asFile?.get()}\n") } catch (e) {}
                          taskLog.flush()
                      }
                  }
              }
              taskLog.write("\nDone scanning.\n")
              taskLog.flush()
              println "[nforge] Logger active -> ${logDir}/tasks.log"
          }
          GRADLEOF

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --console=plain --no-daemon -x lintVitalAnalyzeRelease
        env:
          TERMUX_RELEASE_STORE_FILE: testkey_untrusted.jks
          TERMUX_RELEASE_STORE_PASSWORD: android
          TERMUX_RELEASE_KEY_ALIAS: alias
          TERMUX_RELEASE_KEY_PASSWORD: android
          JITPACK_NDK_VERSION: "29.0.14206865"

      - name: Verify APK
        run: |
          ls -lh app/build/outputs/apk/release/app-release.apk
          python3 -c "
          import zipfile
          z = zipfile.ZipFile('app/build/outputs/apk/release/app-release.apk')
          total = sum(i.file_size for i in z.infolist())
          print(f'APK: {total/1024/1024:.1f}MB, {len(z.namelist())} entries')
          print(f'Manifest: {any(\"AndroidManifest\" in n for n in z.namelist())}')
          print(f'resources.arsc: {any(\"resources.arsc\" in n for n in z.namelist())}')
          dex_count = sum(1 for n in z.namelist() if n.endswith('.dex'))
          so_count = sum(1 for n in z.namelist() if n.endswith('.so'))
          print(f'dex: {dex_count}, .so: {so_count}')
          for n in z.namelist():
              if 'bootstrap' in n and n.endswith('.so'):
                  print(f'  {n}: {z.getinfo(n).file_size/1024/1024:.1f}MB')
          z.close()
          "

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: termux-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
