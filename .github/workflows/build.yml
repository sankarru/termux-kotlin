name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 29
        run: sdkmanager "ndk;29.0.14206865"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download bootstraps
        run: ./gradlew :app:downloadBootstraps --console=plain --no-daemon

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain --no-daemon

      - name: Verify APK
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          ls -lh "$APK"
          python3 -c "
          import zipfile, sys
          z = zipfile.ZipFile('$APK')
          total = sum(i.file_size for i in z.infolist())
          print(f'APK: {total/1024/1024:.1f}MB, {len(z.namelist())} entries')
          print(f'Manifest: {any(\"AndroidManifest\" in n for n in z.namelist())}')
          print(f'resources.arsc: {any(\"resources.arsc\" in n for n in z.namelist())}')
          print(f'dex: {sum(1 for n in z.namelist() if n.endswith(\".dex\"))}')
          print(f'.so: {sum(1 for n in z.namelist() if n.endswith(\".so\"))}')
          bootstrap = [n for n in z.namelist() if 'bootstrap' in n and n.endswith('.so')]
          for b in bootstrap:
              print(f'  {b}: {z.getinfo(b).file_size/1024/1024:.1f}MB')
          z.close()
          "

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: termux-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
