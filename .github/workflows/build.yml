name: Build Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;29.0.14206865"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.jks

      - name: Build release APK
        run: ./gradlew clean :app:assembleRelease --console=plain --no-daemon
        env:
          TERMUX_RELEASE_STORE_FILE: release.jks
          TERMUX_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          TERMUX_RELEASE_KEY_ALIAS: release
          TERMUX_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Verify APK
        run: |
          ls -lh app/build/outputs/apk/release/app-release.apk
          unzip -l app/build/outputs/apk/release/app-release.apk | grep -E "AndroidManifest|resources\.arsc|\.dex|\.so" | head -20
          echo "---"
          python3 -c "
          import zipfile
          z = zipfile.ZipFile('app/build/outputs/apk/release/app-release.apk')
          total = sum(i.file_size for i in z.infolist())
          print(f'APK: {total/1024/1024:.1f}MB, {len(z.namelist())} entries')
          has_manifest = any('AndroidManifest' in n for n in z.namelist())
          has_arsc = any('resources.arsc' in n for n in z.namelist())
          dex_count = sum(1 for n in z.namelist() if n.endswith('.dex'))
          so_count = sum(1 for n in z.namelist() if n.endswith('.so'))
          print(f'Manifest: {has_manifest}, resources.arsc: {has_arsc}, dex: {dex_count}, .so: {so_count}')
          z.close()
          "

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: termux-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
